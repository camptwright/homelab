name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run behavior and contract tests
        run: |
          bash tests/test-compose-env.sh
          bash tests/test-docs-contract.sh
          bash tests/test-image-pins.sh
          bash tests/test-image-pins-policy.sh
          bash tests/test-security-contract.sh
          bash tests/test-wellthread-readiness.sh
          bash tests/test-backup-postgres.sh
          bash tests/test-restore-postgres.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Validate systemd units
        run: |
          sudo install -d -m 0755 /opt/homelab/scripts
          sudo install -m 0755 scripts/backup-postgres.sh scripts/restore-test-postgres.sh /opt/homelab/scripts/
          systemd-analyze verify systemd/homelab-postgres-backup.service systemd/homelab-postgres-backup.timer

      - name: Validate Docker Compose
        run: |
          cp env.adjutant.example .env.adjutant
          docker compose --env-file env.example --profile core --profile apps --profile adjutant config --quiet
