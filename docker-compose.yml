# Homelab core stack - KAMRUI Pinova P1 (2C/16GB), Debian LXC on Proxmox
# Profiles:
#   core     - postgres, redis, litellm, cloudflared, ntfy,
#              ollama-embed                                       (always on)
#   apps     - dashboard, miniflux, uptime-kuma, linkding, beszel  (tonight)
#   adjutant - api, worker, beat                                   (after Phase 1 prompts)
#   extras   - vaultwarden, actualbudget, whodb                    (optional)
#   media    - jellyfin                                            (FUTURE, HP node; see SETUP.md)
#
# Usage: docker compose --profile core --profile apps up -d
# Image updates: every production-capable image is digest-pinned; see IMAGE-PINS.md.

name: homelab

networks:
  homelab:

volumes:
  pgdata:
  redisdata:
  kuma:
  linkding:
  ntfy:
  beszel:
  vaultwarden:
  actualbudget:
  ollamaembed:

x-small: &small
  restart: unless-stopped
  networks: [homelab]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    <<: *small
    profiles: [core]
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    mem_limit: 1536m
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 5}

  redis:
    <<: *small
    profiles: [core]
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    mem_limit: 384m
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5}

  litellm:
    <<: *small
    profiles: [core]
    image: ghcr.io/berriai/litellm:main-latest@sha256:d1fc1c122e2c1a0cec2b00540b220ff0d2682842758eb8bc64e373a1aedfec7e
    user: "65532:65532"   # image-provided nonroot account
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    command: ["--config", "/config/litellm-config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY}
    volumes: ["./litellm-config.yaml:/config/litellm-config.yaml:ro"]
    # 512m SIGKILLs the proxy during startup (exit 137). Note OOMKilled reads
    # false because Docker is nested in an unprivileged LXC and the cgroup OOM
    # event never reaches Docker's state - trust exit 137, not the flag.
    mem_limit: 1536m
    # IPv4 LAN-reachable for other LXCs. No IPv6 publish and no tunnel route.
    # The master key still crosses the trusted private LAN over HTTP; SECURITY.md.
    ports: ["0.0.0.0:4000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cloudflared:
    <<: *small
    profiles: [core]
    image: cloudflare/cloudflared:latest@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 128m

  ntfy:
    <<: *small
    profiles: [core]
    image: binwiederhier/ntfy:latest@sha256:081b53dbb20674fcfe05fdb4eb8af9036a2645ef979543d16f7f80803af467b1
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://ntfy.${DOMAIN}
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
    volumes: [ntfy:/var/lib/ntfy]
    mem_limit: 128m

  # Embeddings sidecar (SETUP.md B7). Permanent home for the `embed` alias:
  # pgvector memories are only comparable if every vector comes from the same
  # model, and memory writes must not depend on the gaming PC being awake.
  ollama-embed:
    <<: *small
    profiles: [core]
    image: ollama/ollama:latest@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    volumes: [ollamaembed:/root/.ollama]
    mem_limit: 1024m

  # ---------------------------------------------------------------- apps ----
  dashboard:
    <<: *small
    profiles: [apps]
    image: ghcr.io/camptwright/homelab-dashboard:sha-e8b12d91e44e721dd50ff35979758e4891dd95bb@sha256:52acae4e2b39f1946fee1607a62338253dda0d5dbac3c6f6369eaa186d885469
    environment:
      DATABASE_URL: postgresql://dashboard:${DASHBOARD_DB_PASSWORD}@postgres:5432/dashboard
      DOMAIN: ${DOMAIN}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      ADJUTANT_API_URL: http://adjutant:8000
      ADJUTANT_API_TOKEN: ${ADJUTANT_API_TOKEN}
      MINIFLUX_URL: http://miniflux:8080
      MINIFLUX_TOKEN: ${MINIFLUX_TOKEN}
      FANTASY_EDGE_URL: ${FANTASY_EDGE_URL}
      MARKETS_URL: http://marketdesk:8000
      MARKETS_API_TOKEN: ${MARKETS_API_TOKEN}
      ARTICLE_INGEST_TOKEN: ${ARTICLE_INGEST_TOKEN}
      BESZEL_URL: http://beszel:8090
      BESZEL_API_EMAIL: ${BESZEL_API_EMAIL}
      BESZEL_API_PASSWORD: ${BESZEL_API_PASSWORD}
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_STATUS_SLUG: dashboard-internal
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m

  miniflux:
    <<: *small
    profiles: [apps]
    image: miniflux/miniflux:latest@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD}@postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: camp
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      BASE_URL: https://rss.${DOMAIN}
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m

  uptime-kuma:
    <<: *small
    profiles: [apps]
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    volumes: [kuma:/app/data]
    mem_limit: 384m

  linkding:
    <<: *small
    profiles: [apps]
    image: sissbruecker/linkding:latest@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
    environment:
      LD_SUPERUSER_NAME: camp
      LD_SUPERUSER_PASSWORD: ${LINKDING_PASSWORD}
    volumes: [linkding:/etc/linkding/data]
    mem_limit: 256m

  marketdesk:
    <<: *small
    profiles: [apps]
    image: ghcr.io/camptwright/marketdesk:sha-453148a45f719794fd95c4242ebb3470eb854b78@sha256:8ee4b6a952c659f56f658b07125a2f7a589a1783224afbc1d67e12d7024f4f06
    environment:
      DATABASE_URL: postgresql+asyncpg://markets:${MARKETS_DB_PASSWORD}@postgres:5432/markets
      API_BEARER_TOKEN: ${MARKETS_API_TOKEN}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      TZ: America/Chicago
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 384m

  beszel:
    <<: *small
    profiles: [apps]
    image: henrygd/beszel:latest@sha256:a849ad80814b6a1a3be665304dcace5d4854b3bed7bde4dd1227e8ce1b82d477
    volumes: [beszel:/beszel_data]
    mem_limit: 128m

  beszel-agent:
    profiles: [apps]
    image: henrygd/beszel-agent:latest@sha256:8874e2c53f9de5e063a6a80d6b617e20fa593ac5dc4eb4c6ce1f912f510f38f8
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    network_mode: host
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    environment:
      LISTEN: "45876"
      KEY: ${BESZEL_AGENT_KEY}
    # :ro protects the socket path, not the Docker API. This remains
    # root-equivalent daemon trust by explicit acceptance; see SECURITY.md.
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    mem_limit: 64m

  # ----------------------------------------------------------- wellthread ----
  # Self-hosted replacement for Supabase cloud: GoTrue (auth) + PostgREST
  # (data API) against the shared Postgres, behind an nginx gateway that
  # reproduces Supabase's URL layout. This keeps the Supabase JS client
  # contract intact, so wellthread-web needs no data-layer rewrite.
  # Deliberately omitted: realtime, storage, edge-runtime - the app uses none
  # of them, and the edge functions were ported to Next.js routes.
  wellthread-auth:
    <<: *small
    profiles: [apps]
    image: supabase/gotrue:v2.177.0@sha256:6a916b47af0386b7e0152ca84f3d45d050bf056e449a75a5460b48742fd67822
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://wellthread.${DOMAIN}
      GOTRUE_SITE_URL: https://wellthread.${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://wellthread.${DOMAIN}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@postgres:5432/wellthread?search_path=auth&sslmode=disable
      # Must match PGRST_JWT_SECRET exactly or PostgREST rejects every token.
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Single-user instance: flip to "true" once the account exists.
      GOTRUE_DISABLE_SIGNUP: "false"
      # No SMTP configured yet, so confirmation mail cannot be delivered.
      # Autoconfirm keeps signup working; revisit if this ever serves anyone
      # other than Camp (see NEXT-STEPS.md).
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 192m

  wellthread-rest:
    <<: *small
    profiles: [apps]
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    environment:
      # Logs in as `authenticator`, which has no rights of its own and
      # SET ROLEs per-request from the JWT. Row isolation is enforced by the
      # 70 RLS policies in the schema, not by this connection.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/wellthread
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m

  wellthread-web:
    <<: *small
    profiles: [apps]
    image: ghcr.io/camptwright/wellthread-web:sha-b4efbbe8ffb6c827fbc14052ee6f71f3920c2c85@sha256:13253c74c156f54a0a1ba53f3c3743aba8acde2f99a7cbaa9f34412afdee09dc
    environment:
      # Server-side rendering stays on the docker network instead of hairpinning
      # out through Cloudflare and back. The browser uses the public origin,
      # which is baked in at build time as NEXT_PUBLIC_SUPABASE_URL.
      SUPABASE_INTERNAL_URL: http://wellthread-gateway:8080
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m

  wellthread-gateway:
    <<: *small
    profiles: [apps]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./wellthread-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wellthread-auth: {condition: service_started}
      wellthread-rest: {condition: service_started}
      wellthread-web: {condition: service_healthy}
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      retries: 3

  # ------------------------------------------------------------ adjutant ----
  # Single container, no Celery/Redis: FastAPI + an in-process APScheduler
  # (jobs sourced from the `schedules` table) share one event loop, the
  # same "no fork-safety concern" shape as marketdesk. Ad-hoc /task
  # submissions run via FastAPI BackgroundTasks on that same loop.
  adjutant:
    <<: *small
    profiles: [adjutant]
    image: ghcr.io/camptwright/adjutant:sha-07fc214a7c8e1f9a0d63e630feafdb483072011b@sha256:7e716c621a86cc667a1be9e476426f3dd14ac043decfc91295a04b4671c63136
    env_file: [.env.adjutant]
    # Proxmox's self-signed cert, pinned rather than verify=False - see
    # src/agents/tools/proxmox.py in the adjutant repo. Public CA cert,
    # not a secret; safe to commit.
    volumes: ["./proxmox-ca.pem:/app/proxmox-ca.pem:ro"]
    # The cert's SANs are 192.168.1.191/reekserver/reekserver.local, not
    # the 10.51.24.34 address this whole stack otherwise reaches the
    # Proxmox host through (two subnets, one host) - TLS then fails on a
    # hostname mismatch even with the right CA. Rather than depend on
    # 192.168.1.191 being routable from this container, pin the SAN's own
    # hostname to the address that's already known-reachable so SNI/cert
    # validation matches without touching the network path at all.
    extra_hosts: ["reekserver:10.51.24.34"]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m

  # -------------------------------------------------------------- extras ----
  vaultwarden:
    <<: *small
    profiles: [extras]
    image: vaultwarden/server:latest@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: "false"   # set true for first signup, then back to false
    volumes: [vaultwarden:/data]
    mem_limit: 256m

  actualbudget:
    <<: *small
    profiles: [extras]
    image: actualbudget/actual-server:latest@sha256:0b300f370dba85a74998a953736a831bd931cc8cb76c0d8ceac3d3fd288dfd4d
    volumes: [actualbudget:/data]
    mem_limit: 256m

  whodb:
    <<: *small
    profiles: [extras]
    image: clidey/whodb:latest@sha256:0f75d6bd4fb933c97f37a9f5400fdecc02bb0c43399ffcb492f8b57baa2a4a03
    mem_limit: 256m

  # ------------------------------------------------- media (FUTURE: HP node) ----
  # The R2544's AMD iGPU is a poor transcoder; run Jellyfin here only for
  # direct-play testing. Real home is an HP node (i5-9500T Quick Sync).
  jellyfin:
    <<: *small
    profiles: [media]
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/media:/media:ro
    # devices: ["/dev/dri:/dev/dri"]   # uncomment on Intel for Quick Sync
    mem_limit: 2048m
