# Homelab core stack - KAMRUI Pinova P1 (2C/16GB), Debian LXC on Proxmox
# Profiles:
#   core     - postgres, redis, litellm, cloudflared, ntfy,
#              ollama-embed                                       (always on)
#   apps     - dashboard, miniflux, uptime-kuma, linkding, beszel  (tonight)
#   adjutant - api, worker, beat                                   (after Phase 1 prompts)
#   extras   - vaultwarden, actualbudget, whodb                    (optional)
#   media    - jellyfin                                            (FUTURE, HP node; see SETUP.md)
#
# Usage: docker compose --profile core --profile apps up -d

name: homelab

networks:
  homelab:

volumes:
  pgdata:
  redisdata:
  kuma:
  linkding:
  ntfy:
  beszel:
  vaultwarden:
  actualbudget:
  ollamaembed:

x-small: &small
  restart: unless-stopped
  networks: [homelab]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    <<: *small
    profiles: [core]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    mem_limit: 1536m
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, retries: 5}

  redis:
    <<: *small
    profiles: [core]
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    mem_limit: 384m
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5}

  litellm:
    <<: *small
    profiles: [core]
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/config/litellm-config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY}
    volumes: ["./litellm-config.yaml:/config/litellm-config.yaml:ro"]
    # 512m SIGKILLs the proxy during startup (exit 137). Note OOMKilled reads
    # false because Docker is nested in an unprivileged LXC and the cgroup OOM
    # event never reaches Docker's state - trust exit 137, not the flag.
    mem_limit: 1536m
    ports: ["4000:4000"]   # LAN-reachable so OpenClaw/other LXCs can use it too

  cloudflared:
    <<: *small
    profiles: [core]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 128m

  ntfy:
    <<: *small
    profiles: [core]
    image: binwiederhier/ntfy:latest
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://ntfy.${DOMAIN}
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
    volumes: [ntfy:/var/lib/ntfy]
    mem_limit: 128m

  # Embeddings sidecar (SETUP.md B7). Permanent home for the `embed` alias:
  # pgvector memories are only comparable if every vector comes from the same
  # model, and memory writes must not depend on the gaming PC being awake.
  ollama-embed:
    <<: *small
    profiles: [core]
    image: ollama/ollama:latest
    volumes: [ollamaembed:/root/.ollama]
    mem_limit: 1024m

  # ---------------------------------------------------------------- apps ----
  dashboard:
    <<: *small
    profiles: [apps]
    image: ghcr.io/camptwright/homelab-dashboard:latest   # built by Prompt A1
    environment:
      DATABASE_URL: postgresql://dashboard:${DASHBOARD_DB_PASSWORD}@postgres:5432/dashboard
      DOMAIN: ${DOMAIN}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      ADJUTANT_API_URL: http://adjutant-api:8000
      ADJUTANT_API_TOKEN: ${ADJUTANT_API_TOKEN}
      MINIFLUX_URL: http://miniflux:8080
      MINIFLUX_TOKEN: ${MINIFLUX_TOKEN}
      FANTASY_EDGE_URL: ${FANTASY_EDGE_URL}
      ARTICLE_INGEST_TOKEN: ${ARTICLE_INGEST_TOKEN}
      BESZEL_URL: http://beszel:8090
      BESZEL_API_EMAIL: ${BESZEL_API_EMAIL}
      BESZEL_API_PASSWORD: ${BESZEL_API_PASSWORD}
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_STATUS_SLUG: dashboard-internal
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m

  miniflux:
    <<: *small
    profiles: [apps]
    image: miniflux/miniflux:latest
    environment:
      DATABASE_URL: postgres://miniflux:${MINIFLUX_DB_PASSWORD}@postgres:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: camp
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      BASE_URL: https://rss.${DOMAIN}
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m

  uptime-kuma:
    <<: *small
    profiles: [apps]
    image: louislam/uptime-kuma:1
    volumes: [kuma:/app/data]
    mem_limit: 384m

  linkding:
    <<: *small
    profiles: [apps]
    image: sissbruecker/linkding:latest
    environment:
      LD_SUPERUSER_NAME: camp
      LD_SUPERUSER_PASSWORD: ${LINKDING_PASSWORD}
    volumes: [linkding:/etc/linkding/data]
    mem_limit: 256m

  marketdesk:
    <<: *small
    profiles: [apps]
    image: ghcr.io/camptwright/marketdesk:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://markets:${MARKETS_DB_PASSWORD}@postgres:5432/markets
      API_BEARER_TOKEN: ${MARKETS_API_TOKEN}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      TZ: America/Chicago
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 384m

  beszel:
    <<: *small
    profiles: [apps]
    image: henrygd/beszel:latest
    volumes: [beszel:/beszel_data]
    mem_limit: 128m

  beszel-agent:
    profiles: [apps]
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    environment:
      LISTEN: "45876"
      KEY: ${BESZEL_AGENT_KEY}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    mem_limit: 64m

  # ----------------------------------------------------------- wellthread ----
  # Self-hosted replacement for Supabase cloud: GoTrue (auth) + PostgREST
  # (data API) against the shared Postgres, behind an nginx gateway that
  # reproduces Supabase's URL layout. This keeps the Supabase JS client
  # contract intact, so wellthread-web needs no data-layer rewrite.
  # Deliberately omitted: realtime, storage, edge-runtime - the app uses none
  # of them, and the edge functions were ported to Next.js routes.
  wellthread-auth:
    <<: *small
    profiles: [apps]
    image: supabase/gotrue:v2.177.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://wellthread.${DOMAIN}
      GOTRUE_SITE_URL: https://wellthread.${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://wellthread.${DOMAIN}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@postgres:5432/wellthread?search_path=auth&sslmode=disable
      # Must match PGRST_JWT_SECRET exactly or PostgREST rejects every token.
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Single-user instance: flip to "true" once the account exists.
      GOTRUE_DISABLE_SIGNUP: "false"
      # No SMTP configured yet, so confirmation mail cannot be delivered.
      # Autoconfirm keeps signup working; revisit if this ever serves anyone
      # other than Camp (see NEXT-STEPS.md).
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 192m

  wellthread-rest:
    <<: *small
    profiles: [apps]
    image: postgrest/postgrest:v12.2.3
    environment:
      # Logs in as `authenticator`, which has no rights of its own and
      # SET ROLEs per-request from the JWT. Row isolation is enforced by the
      # 70 RLS policies in the schema, not by this connection.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/wellthread
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m

  wellthread-web:
    <<: *small
    # `pending` until the first Actions build publishes the image: a missing
    # GHCR image returns "denied" and one failed pull interrupts every other
    # parallel pull in the same `up`. Flip to [apps] after CI goes green.
    profiles: [pending]
    image: ghcr.io/camptwright/wellthread-web:latest
    environment:
      # Server-side rendering stays on the docker network instead of hairpinning
      # out through Cloudflare and back. The browser uses the public origin,
      # which is baked in at build time as NEXT_PUBLIC_SUPABASE_URL.
      SUPABASE_INTERNAL_URL: http://wellthread-gateway:8080
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 512m

  wellthread-gateway:
    <<: *small
    profiles: [apps]
    image: nginx:1.27-alpine
    volumes:
      - ./wellthread-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    # Deliberately does NOT depend on wellthread-web: that service sits in
    # profile `pending`, and a depends_on pointing at an out-of-scope service
    # fails the whole project with "depends on undefined service". Until the
    # app image exists the gateway simply 502s on /, while /auth/v1 and
    # /rest/v1 keep working.
    depends_on: [wellthread-auth, wellthread-rest]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      retries: 3

  # ------------------------------------------------------------ adjutant ----
  adjutant-api:
    <<: *small
    profiles: [adjutant]
    image: ghcr.io/camptwright/adjutant:latest
    command: ["api"]
    env_file: [.env.adjutant]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 768m

  adjutant-worker:
    <<: *small
    profiles: [adjutant]
    image: ghcr.io/camptwright/adjutant:latest
    command: ["worker"]
    env_file: [.env.adjutant]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1024m

  adjutant-beat:
    <<: *small
    profiles: [adjutant]
    image: ghcr.io/camptwright/adjutant:latest
    command: ["beat"]
    env_file: [.env.adjutant]
    depends_on: {redis: {condition: service_healthy}}
    mem_limit: 256m

  # -------------------------------------------------------------- extras ----
  vaultwarden:
    <<: *small
    profiles: [extras]
    image: vaultwarden/server:latest
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: "false"   # set true for first signup, then back to false
    volumes: [vaultwarden:/data]
    mem_limit: 256m

  actualbudget:
    <<: *small
    profiles: [extras]
    image: actualbudget/actual-server:latest
    volumes: [actualbudget:/data]
    mem_limit: 256m

  whodb:
    <<: *small
    profiles: [extras]
    image: clidey/whodb:latest
    mem_limit: 256m

  # ------------------------------------------------- media (FUTURE: HP node) ----
  # The R2544's AMD iGPU is a poor transcoder; run Jellyfin here only for
  # direct-play testing. Real home is an HP node (i5-9500T Quick Sync).
  jellyfin:
    <<: *small
    profiles: [media]
    image: jellyfin/jellyfin:latest
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/media:/media:ro
    # devices: ["/dev/dri:/dev/dri"]   # uncomment on Intel for Quick Sync
    mem_limit: 2048m
