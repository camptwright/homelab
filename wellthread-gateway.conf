# Reproduces the URL layout the Supabase JS client expects, so wellthread-web
# needs no application changes: NEXT_PUBLIC_SUPABASE_URL just points here
# instead of at supabase.co.
#
#   {url}/auth/v1/*  -> GoTrue
#   {url}/rest/v1/*  -> PostgREST
#
# Deliberately NOT served: /storage/v1, /realtime/v1, /functions/v1. The app
# uses none of them (verified), and the edge functions were ported to
# wellthread-web's own Next.js routes.

server {
    listen 8080;
    server_name _;

    # Bodies are small JSON payloads; cap them well below anything abusive.
    client_max_body_size 2m;

    # PostgREST and GoTrue both sit behind this, so normalise CORS in one place.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/v1/ {
        proxy_pass http://wellthread-auth:9999/;
    }

    location /rest/v1/ {
        proxy_pass http://wellthread-rest:3000/;
    }

    # Cheap liveness target for Uptime Kuma and the container healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
