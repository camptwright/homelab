# Reproduces the URL layout the Supabase JS client expects, so wellthread-web
# needs no application changes: NEXT_PUBLIC_SUPABASE_URL just points here
# instead of at supabase.co.
#
#   {url}/auth/v1/*      -> GoTrue
#   {url}/rest/v1/*      -> PostgREST
#   {url}/*              -> the Next.js app (which also serves /functions/v1/*
#                           via a rewrite to its own /api/functions routes)
#
# Deliberately NOT served: /storage/v1 and /realtime/v1. The app uses neither.

# Every upstream is referenced through a variable so nginx defers DNS to
# request time. With literal hostnames nginx resolves at startup and exits
# fatally ("host not found in upstream") if any backend is absent - which
# takes the whole gateway down just because one service is stopped. This way a
# missing backend is a per-request 502 instead.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Bodies are small JSON payloads; cap well below anything abusive.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/v1/ {
        set $gotrue http://wellthread-auth:9999;
        # Reproduces the prefix-stripping a trailing-slash proxy_pass would do,
        # which variable form does not perform automatically.
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $gotrue;
    }

    location /rest/v1/ {
        set $postgrest http://wellthread-rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $postgrest;
    }

    # Cheap liveness target for Uptime Kuma and the container healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else is the Next.js app. Serving app and API from one origin
    # means the browser client and the server-side client share a host, so
    # there is no CORS surface and only one tunnel hostname to maintain.
    location / {
        set $wellthread_web http://wellthread-web:3000;
        proxy_pass $wellthread_web$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
